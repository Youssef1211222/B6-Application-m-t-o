
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo App</title>
    <link rel="stylesheet" href="./dist/output.css">
    <script src="js/script.js" defer></script>
</head>

<body class="min-h-screen bg-[#0B1220] text-white">

    <header class="border-b border-slate-800 bg-[#0F1B2D] px-6 py-5">
        <div class="mx-auto flex max-w-4xl items-center gap-3">
            <span class="text-3xl">🌤️</span>
            <h1 class="text-2xl font-bold text-white">
                Météo App
            </h1>
        </div>
    </header>

    <main class="mx-auto max-w-4xl px-4 py-10 sm:px-6">

        <section class="rounded-2xl border border-slate-700 bg-[#172338] p-6 shadow-xl">

            <h2 class="mb-6 text-xl font-semibold text-white">
                Rechercher une ville
            </h2>

            <form
                id="form-recherche"
                class="flex flex-col gap-4 sm:flex-row sm:items-end"
            >
                <div class="flex-1">
                    <label
                        for="ville"
                        class="mb-2 block text-sm font-medium text-slate-300"
                    >
                        Ville
                    </label>

                    <input
                        type="text"
                        id="ville"
                        name="ville"
                        placeholder="Ex : Nador"
                        class="w-full rounded-xl border border-slate-600 bg-[#0B1220] p-3 text-white placeholder:text-slate-400 outline-none focus:border-blue-400"
                    >
                </div>

                <button
                    type="submit"
                    class="rounded-xl bg-blue-600 px-6 py-3 font-semibold text-white transition hover:bg-blue-500"
                >
                    Rechercher
                </button>
            </form>

            <p
                id="message-erreur"
                class="mt-4 hidden text-red-400"
                role="alert"
            ></p>

            <p
                id="chargement"
                class="mt-4 hidden text-blue-400"
                role="status"
            >
                Chargement...
            </p>

        </section>

        <section
            id="resultat-meteo"
            class="mt-6"
            aria-live="polite"
        ></section>

    </main>

</body>
</html>
